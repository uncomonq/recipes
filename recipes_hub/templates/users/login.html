{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Login" %}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container" style="max-width: 520px;">
    <h1 class="mb-4">{% trans "Login" %}</h1>
    <form method="post" class="card card-body shadow-sm">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-warning text-white">{% trans "Sign in" %}</button>
    </form>
    <p class="mt-3 mb-1"><a href="{% url 'users:password_reset' %}">{% trans "Forgot password?" %}</a></p>
    <p class="mb-0">
      {% trans "No account yet?" %}
      <a href="{% url 'users:signup' %}">{% trans "Create one" %}</a>
    </p>
  </div>
</section>
{% endblock %}
