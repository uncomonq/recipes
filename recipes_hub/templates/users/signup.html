{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Sign up" %}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container" style="max-width: 520px;">
    <h1 class="mb-4">{% trans "Create account" %}</h1>
    <form method="post" class="card card-body shadow-sm">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-warning text-white">{% trans "Register" %}</button>
    </form>
    <p class="mt-3 mb-0">
      {% trans "Already have an account?" %}
      <a href="{% url 'users:login' %}">{% trans "Login" %}</a>
    </p>
  </div>
</section>
{% endblock %}
