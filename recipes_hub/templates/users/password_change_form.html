{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change password" %}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container" style="max-width: 520px;">
    <h1 class="mb-4">{% trans "Change password" %}</h1>
    <form method="post" class="card card-body shadow-sm">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-warning text-white">{% trans "Update password" %}</button>
    </form>
    <p class="mt-3 mb-0"><a href="{% url 'users:profile' %}">{% trans "Back to profile" %}</a></p>
  </div>
</section>
{% endblock %}
