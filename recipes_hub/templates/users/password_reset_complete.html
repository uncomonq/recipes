{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password reset complete" %}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container" style="max-width: 520px;">
    <h1>{% trans "Password updated" %}</h1>
    <p>{% trans "Your password has been set. You can sign in now." %}</p>
    <p class="mb-0"><a href="{% url 'users:login' %}">{% trans "Sign in" %}</a></p>
  </div>
</section>
{% endblock %}
